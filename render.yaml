services:
  - type: web
    name: placement-management-system
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: placement_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
